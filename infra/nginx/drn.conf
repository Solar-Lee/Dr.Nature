# Dr.Nature (project prefix drn) — /etc/nginx/sites-available/drn.conf, symlinked into
# sites-enabled. The ONLY nginx file this project adds (CLAUDE.md §1.3). Source of truth: this
# file in the repo (infra/nginx/drn.conf); deploy with `nginx -t` then `systemctl reload nginx`.
#
# P12-12: temporary page for dr.nature.smilelife.tw; P12-26 (2026-10-14): the password-protected
# preview storefront (apps/storefront static export) replaces it. Releases live under
# /var/www/drn/preview/releases/<sha12>, `current` is a symlink; the htpasswd is /opt/drn/drn.htpasswd
# (outside /etc/nginx, CLAUDE.md §1.3). Certificate: certbot certonly --webroot -w /var/www/drn
# (renewal: certbot.timer, deploy hook "systemctl reload nginx"); the port-80 block must stay as is.
# Deliberately no `http2` on the 443 listen: nginx turns it on for every server sharing the
# socket, which would change other projects' sites.

server {
    listen 80;
    server_name dr.nature.smilelife.tw;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/drn;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dr.nature.smilelife.tw;

    ssl_certificate     /etc/letsencrypt/live/dr.nature.smilelife.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dr.nature.smilelife.tw/privkey.pem;

    root  /var/www/drn/preview/current;
    index index.html;

    # Preview: only people with the password; never indexed.
    auth_basic           "Dr.Nature preview";
    auth_basic_user_file /opt/drn/drn.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # PF-01 (2026-10-15): compress text responses (home page JS: 1,333,589 B raw vs 377,642 B gzip
    # in the 2026-10-14 audit). Only inside this server block, so no other site changes
    # (CLAUDE.md §1.3). text/html is always compressed once gzip is on (ngx_http_gzip_module docs).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Files under /_next/static/ have content-hashed names (chunks/) or sit in a per-build directory,
    # and `next start` itself sends this header for them (next 16.4.0 dist/server/lib/router-server.js).
    # add_header is inherited only when a level defines none (ngx_http_headers_module), so the two
    # server-level headers are repeated here; auth_basic is still inherited, assets stay password-only.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Next.js static export with trailingSlash: /story/ -> /story/index.html; unknown paths 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
